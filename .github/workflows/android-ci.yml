name: Android CI Build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: '选择构建版本 (Standard 只编标准版 / Full 编译全量包)'
        required: true
        default: 'standard'
        type: choice
        options:
          - standard
          - full
  push:
    branches:
      - "**"

permissions:
  contents: write

concurrency:
  # Group per ref AND event type: routine pushes to the same branch still cancel
  # their superseded check runs, but a workflow_dispatch packaging run is never
  # cancelled by a merge push landing on the same ref mid-build.
  group: android-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download code
        uses: actions/checkout@v6

      - name: Prepare Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android tools
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install needed tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Run checks
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            -PskipShellTemplateSync=true \
            -PallowDebugSignedRelease=true \
            :app:compileStandardDebugKotlin \
            :shell:compileDebugKotlin \
            :app:testStandardDebugUnitTest \
            :app:checkConfigFieldDrift

      - name: Compile F-Droid variant
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            -PskipShellTemplateSync=true \
            -Pfdroid=true \
            :app:compileStandardReleaseKotlin \
            :shell:compileReleaseKotlin \
            :app:processStandardReleaseManifest \
            :shell:processReleaseManifest

  package-apks:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Download code
        uses: actions/checkout@v6

      - name: Prepare Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android tools
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install needed tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/release.keystore
          test -s ${{ github.workspace }}/release.keystore && echo "Keystore decoded successfully"

      # ★ Push 触发时：只构建 Standard 变体，节约时间
      - name: Build APKs (Standard Only)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'standard')
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            -PallowDebugSignedRelease=true \
            :app:assembleStandardRelease

      # ★ 手动触发时：构建所有变体 (Standard/Gplay, Debug/Release, Shell)
      - name: Build APKs (Full)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'full'
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            -PallowDebugSignedRelease=true \
            :app:assembleStandardDebug \
            :app:assembleStandardRelease \
            :app:assembleGplayDebug \
            :app:assembleGplayRelease \
            :shell:assembleDebug \
            :shell:assembleRelease


      - name: Upload generated demo APK
        uses: actions/upload-artifact@v4
        with:
          name: generated-demo-apk-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      # 整理并重命名产物
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          # 智能扫描：不管编译了哪个变体，只要有 APK 就抓过来
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-assets/ \;
          cd release-assets
          for f in *.apk; do
            # 提取渠道 (standard 或 gplay)
            flavor=""
            if [[ "$f" == *"standard"* ]]; then flavor="standard"; fi
            if [[ "$f" == *"gplay"* ]]; then flavor="gplay"; fi
            
            # 提取构建类型 (debug 或 release)
            build_type=""
            if [[ "$f" == *"debug"* ]]; then build_type="debug"; fi
            if [[ "$f" == *"release"* ]]; then build_type="release"; fi
            
            # 如果成功提取，则重新组装名字
            if [ -n "$flavor" ] && [ -n "$build_type" ]; then
              # 首字母大写美化 (Standard, Gplay, Debug, Release)
              Flavor="$(tr '[:lower:]' '[:upper:]' <<< ${flavor:0:1})${flavor:1}"
              BuildType="$(tr '[:lower:]' '[:upper:]' <<< ${build_type:0:1})${build_type:1}"
              mv "$f" "Webapp-${Flavor}-${BuildType}.apk"
            fi
          done
          ls -la

      # 上传临时 Artifacts (以防你只想在这里下载)
      - name: Upload APKs Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Webapp-APKs-${{ github.run_number }}
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 14

      # 读取 app/build.gradle.kts 中的 versionName
      - name: Extract Version Name
        id: get_version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "⚠️ 未找到 versionName，默认使用 v1.0.0"
            VERSION="1.0.0"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "提取到版本号: v$VERSION"

      # 自动发布到 GitHub Release
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Webapp v${{ env.APP_VERSION }}
          body: "Automated release build with custom signed APKs."
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
