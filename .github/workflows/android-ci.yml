name: Android CI Build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: write

concurrency:
  # Group per ref AND event type: routine pushes to the same branch still cancel
  # their superseded check runs, but a workflow_dispatch packaging run is never
  # cancelled by a merge push landing on the same ref mid-build.
  group: android-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download code
        uses: actions/checkout@v6

      - name: Prepare Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android tools
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install needed tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Run checks
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            -PskipShellTemplateSync=true \
            -PallowDebugSignedRelease=true \
            :app:compileStandardDebugKotlin \
            :shell:compileDebugKotlin \
            :app:testStandardDebugUnitTest \
            :app:checkConfigFieldDrift

      - name: Compile F-Droid variant
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            -PskipShellTemplateSync=true \
            -Pfdroid=true \
            :app:compileStandardReleaseKotlin \
            :shell:compileReleaseKotlin \
            :app:processStandardReleaseManifest \
            :shell:processReleaseManifest

  package-apks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Download code
        uses: actions/checkout@v6

      - name: Prepare Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android tools
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install needed tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/release.keystore
          test -s ${{ github.workspace }}/release.keystore && echo "Keystore decoded successfully"

      - name: Build APKs
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            -PallowDebugSignedRelease=true \
            :app:assembleStandardDebug \
            :app:assembleStandardRelease \
            :app:assembleGplayDebug \
            :app:assembleGplayRelease \
            :shell:assembleDebug \
            :shell:assembleRelease

      # End-to-end proof that the export pipeline produces an installable APK: a real
      # Robolectric build through ApkBuilder against the freshly built shell template.
      - name: Build generated demo APK
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            :app:testStandardDebugUnitTest --tests "com.webtoapp.core.apkbuilder.DemoApkExportTest"

      - name: Upload generated demo APK
        uses: actions/upload-artifact@v4
        with:
          name: generated-demo-apk-${{ github.run_number }}
          path: app/build/outputs/demo/
          if-no-files-found: error
          retention-days: 14

      # 整理并重命名产物
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find app/build/outputs/apk/standard/ -name "*.apk" -exec cp {} release-assets/ \;
          find app/build/outputs/apk/gplay/ -name "*.apk" -exec cp {} release-assets/ \;
          cd release-assets
          for f in *.apk; do
            if [[ "$f" == *"standard"* ]]; then mv "$f" "WebToApp-standard-${f}"; fi
            if [[ "$f" == *"gplay"* ]]; then mv "$f" "WebToApp-gplay-${f}"; fi
          done
          ls -la

      # 上传临时 Artifacts (以防你只想在这里下载)
      - name: Upload APKs Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WebToApp-APKs-${{ github.run_number }}
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 14

      # 自动发布到 GitHub Release
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Release Build #${{ github.run_number }}
          body: "Automated release build with custom signed APKs."
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
